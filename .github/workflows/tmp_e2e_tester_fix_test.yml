name: TMP e2e tester role fix test

on:
  push:
    branches: [feature/e2e-tester-role]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: fokus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:testpass@localhost:5432/fokus_test"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Targeted PostgreSQL tests (must all pass)
        id: targeted
        run: |
          set +e
          python -m pytest -v \
            tests/test_e2e_tester_role.py \
            tests/test_e2e_test_isolation.py \
            tests/test_e2e_isolation_db_upgrade.py \
            tests/test_db_migration.py \
            tests/test_shift_deficiency_bot_flow.py \
            tests/test_supplier_purchase_listing.py \
            tests/test_supplier_purchase_entry.py \
            2>&1 | tee targeted_output.log
          exit_code=${PIPESTATUS[0]}
          set -e
          exit "$exit_code"

      - name: Upload targeted output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-output
          path: targeted_output.log

      - name: Baseline comparison files against origin/main (detached worktree)
        if: success()
        run: |
          set +e
          git fetch origin main:refs/remotes/origin/main
          git worktree add /tmp/main-worktree refs/remotes/origin/main
          (
            cd /tmp/main-worktree
            pip install -r requirements-dev.txt
            python -m pytest -v \
              tests/test_cash_shift_bot_flows.py \
              tests/test_recruiting_card.py \
              tests/test_recruiting_logic.py \
              tests/test_recruiting_repository.py \
              tests/test_saturn_group_bot_flows.py \
              tests/test_schedule_change_request_ui.py \
              2>&1 | tee /tmp/main_output.log
            exit "${PIPESTATUS[0]}"
          )
          main_exit=$?
          set -e
          echo "main baseline pytest exit code: $main_exit"
          if [ "$main_exit" -gt 1 ]; then
            echo "INFRASTRUCTURE/COLLECTION FAILURE on main baseline (exit $main_exit) -- BLOCK"
            exit 1
          fi
          grep '^FAILED ' /tmp/main_output.log | awk '{print $2}' | sort -u > /tmp/main_failed.txt
          echo "--- main_failed.txt ---"
          cat /tmp/main_failed.txt || true

      - name: Same files against the feature commit
        if: success()
        run: |
          set +e
          python -m pytest -v \
            tests/test_cash_shift_bot_flows.py \
            tests/test_recruiting_card.py \
            tests/test_recruiting_logic.py \
            tests/test_recruiting_repository.py \
            tests/test_saturn_group_bot_flows.py \
            tests/test_schedule_change_request_ui.py \
            2>&1 | tee /tmp/feature_output.log
          feature_exit=${PIPESTATUS[0]}
          set -e
          echo "feature pytest exit code: $feature_exit"
          if [ "$feature_exit" -gt 1 ]; then
            echo "INFRASTRUCTURE/COLLECTION FAILURE on feature commit (exit $feature_exit) -- BLOCK"
            exit 1
          fi
          grep '^FAILED ' /tmp/feature_output.log | awk '{print $2}' | sort -u > /tmp/feature_failed.txt
          echo "--- feature_failed.txt ---"
          cat /tmp/feature_failed.txt || true

      - name: Compare -- PASS only if no new failures
        if: success()
        run: |
          touch /tmp/main_failed.txt /tmp/feature_failed.txt
          comm -23 /tmp/feature_failed.txt /tmp/main_failed.txt > /tmp/new_failures.txt
          echo "--- new_failures.txt (feature-only failures) ---"
          cat /tmp/new_failures.txt
          if [ -s /tmp/new_failures.txt ]; then
            echo "NEW FAILURES DETECTED -- BLOCK"
            exit 1
          fi
          echo "No new failures -- baseline comparison PASS"

      - name: Upload comparison outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-output
          path: |
            /tmp/main_output.log
            /tmp/feature_output.log
            /tmp/main_failed.txt
            /tmp/feature_failed.txt
            /tmp/new_failures.txt
          if-no-files-found: ignore
