name: Keep Render Bot Awake

on:
  schedule:
    # Har 10 daqiqada ishga tushadi (UTC vaqtida)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # Kerak bo'lsa qo'lda ham ishga tushirish mumkin

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          echo "Pinging https://fokus-ai.onrender.com ..."
          # Render Free tarifida servis uzoq faolsizlikdan keyin uxlab qoladi
          # va "cold start" 30 soniyadan ko'p vaqt olishi mumkin — shuning
          # uchun bir necha marta, uzunroq timeout bilan urinamiz (aks holda
          # ping servisni uyg'otishga vaqt topmasdan muvaffaqiyatsiz tugaydi
          # va servis hech qachon iliq holatga yetmaydi).
          success=0
          for attempt in 1 2 3; do
            response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://fokus-ai.onrender.com || echo "000")
            echo "Urinish $attempt: HTTP status $response"
            if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
              success=1
              break
            fi
            sleep 10
          done

          if [ "$success" -eq 1 ]; then
            echo "Bot uyg'oq (yoki javob berdi)."
          else
            echo "Ogohlantirish: bot 3 urinishdan keyin ham javob bermadi."
            exit 1
          fi
