name: Menu latency regression

on:
  pull_request:
    paths:
      - repositories/bot_messages.py
      - services/menu_screens.py
      - performance_bot.py
      - tests/test_menu_latency.py
      - tests/test_menu_screen_cleanup.py
      - .github/workflows/menu-latency.yml

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: fokus_menu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/fokus_menu_test
      BOT_TOKEN: "123456:TEST-TOKEN"
      OPENAI_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: >-
          python -m pytest -q
          tests/test_menu_latency.py
          tests/test_menu_screen_cleanup.py
          tests/test_chat_cleanup.py
