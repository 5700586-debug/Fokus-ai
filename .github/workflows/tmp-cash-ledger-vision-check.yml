name: TMP Cash Ledger Vision Check

on:
  push:
    branches:
      - feature/cash-ledger-vision-shortage
  workflow_dispatch: {}

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: >
          pytest -v
          tests/test_cash_shift_ai_vision.py
          tests/test_cash_shift_bot_flows.py
          tests/test_vision_extraction_provider.py
          tests/test_cash_shift_service.py
          tests/test_cash_shifts_repo.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: fokus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:testpass@localhost:5432/fokus_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: >
          pytest -v
          tests/test_cash_shift_ai_vision.py
          tests/test_cash_shift_bot_flows.py
          tests/test_vision_extraction_provider.py
          tests/test_cash_shift_service.py
          tests/test_cash_shifts_repo.py
