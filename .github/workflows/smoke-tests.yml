name: Smoke tests

# Har pushda ishlaydi — TEZ va KICHIK: haqiqiy dependency (shu jumladan
# haqiqiy psycopg2, hech qanday stub yo'q) o'rnatiladi va faqat eng
# muhim, barqaror ishlaydigan bir nechta test ishga tushiriladi. To'liq
# (900+) to'plam uchun qarang ``tests.yml`` (endi faqat qo'lda
# ishga tushiriladi).

on:
  push:
    branches:
      - feature/hr-conversational-interview
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify real psycopg2 import (no stub/workaround)
        run: python -c "import psycopg2; print('psycopg2 import OK:', psycopg2.__version__)"

      - name: Smoke tests
        run: >
          pytest -v
          tests/test_saturn_group_bot_flows.py::test_saturntest_tip_sends_only_tip_no_financial_dashboard
          tests/test_saturn_group_bot_flows.py::test_daily_greeting_messages_have_no_financial_block
          tests/test_recruiting_card.py::test_card_shows_birth_date
          tests/test_recruiting_card.py::test_card_computes_age_correctly_from_birth_date
          tests/test_cash_shift_bot_flows.py::test_discrepancy_approve_finalizes_handed_over_shift
          tests/test_cash_shift_bot_flows.py::test_discrepancy_recount_keeps_shift_open_and_resets_kassir_state
          tests/test_bot_flows.py::test_approve_sends_employee_menu_without_requiring_start
          tests/test_bot_flows.py::test_build_menu_and_category_menu_are_persistent
          tests/test_menu_and_fsm_escape.py::test_kassir_menu_buttons_are_paired_two_per_row
          tests/test_menu_and_fsm_escape.py::test_kassir_friendly_button_still_triggers_real_command
          tests/test_menu_and_fsm_escape.py::test_kassir_friendly_button_escapes_stale_expense_state
          tests/test_menu_and_fsm_escape.py::test_start_shows_role_specific_category_for_kassir
          tests/test_cash_shifts_repo.py::test_set_shift_status_if_only_updates_when_status_matches
          tests/test_cash_shift_service.py::test_duplicate_supervisor_decision_only_applies_once
          tests/test_cash_shift_service.py::test_duplicate_confirm_handover_only_succeeds_once
          tests/test_employees.py::test_duplicate_approve_only_succeeds_once
          tests/test_recruiting_permissions.py::test_founder_hire_creates_active_employee_with_role_branch_and_auto_menu
          tests/test_recruiting_permissions.py::test_double_hire_click_does_not_crash_or_duplicate
          tests/test_recruiting_permissions.py::test_set_founder_decision_if_only_claims_when_status_matches
          tests/test_recruiting_permissions.py::test_hire_does_not_touch_employees_when_application_already_claimed
          tests/test_recruiting_permissions.py::test_ordinary_employee_cannot_decide_on_application
          tests/test_recruiting_permissions.py::test_founder_can_decide_on_application
          tests/test_recruiting_permissions.py::test_double_click_on_decision_button_is_a_no_op_the_second_time
          tests/test_recruiting_permissions.py::test_decision_on_unknown_application_does_not_crash
          tests/test_menu_and_fsm_escape.py::test_top_level_menu_button_escapes_stale_expense_state
          tests/test_discipline_bot_flows.py::test_penalty_entry_skipped_when_already_pending_for_same_nazoratchi
          tests/test_cash_shift_bot_flows.py::test_expense_finish_skipped_when_already_pending_for_same_kassir
          tests/test_cash_shift_bot_flows.py::test_closeshift_confirm_skipped_when_already_pending_for_same_kassir
          tests/test_bot_flows.py::test_approve_does_not_send_menu_when_role_assignment_fails
          tests/test_recruiting_permissions.py::test_hire_does_not_send_menu_when_role_assignment_fails
          tests/test_recruiting_bot_flow.py::test_photo_send_is_isolated_from_founder_card_notification
          tests/test_bot_flows.py::test_stores_button_shows_one_button_per_branch
          tests/test_bot_flows.py::test_stores_back_button_returns_founder_menu
          tests/test_bot_flows.py::test_employees_button_shows_empty_placeholder_when_no_users
          tests/test_bot_flows.py::test_employees_button_shows_friendly_name_not_user_id
          tests/test_bot_flows.py::test_tapping_employee_shows_full_read_only_card
          tests/test_cash_shift_bot_flows.py::test_expense_before_shift_open_shows_friendly_message_not_command
          tests/test_cash_shift_bot_flows.py::test_closeshift_before_shift_open_shows_friendly_message_not_command
          tests/test_cash_shift_bot_flows.py::test_first_shift_prompt_has_no_technical_command_wording
          tests/test_cash_shift_bot_flows.py::test_kassa_category_body_text_has_no_raw_slash_commands
          tests/test_cash_shift_bot_flows.py::test_supervisor_recheck_message_has_no_raw_slash_command
          tests/test_bot_flows.py::test_full_onboarding_to_approval_flow
          tests/test_menu_and_fsm_escape.py::test_stale_penalty_state_does_not_swallow_start
          tests/test_menu_and_fsm_escape.py::test_start_shows_founder_category_for_founder
          tests/test_bot_flows.py::test_founder_start_shows_new_greeting_and_five_menu_buttons
          tests/test_store_management.py::test_store_card_shows_no_data_placeholder_when_branch_is_empty
          tests/test_store_management.py::test_store_card_shows_active_employee_count
          tests/test_store_management.py::test_store_card_shows_todays_open_shift_status
          tests/test_store_management.py::test_store_card_employees_subview_shows_name_not_user_id
          tests/test_store_management.py::test_store_card_back_returns_to_branch_list
          tests/test_store_management.py::test_global_employees_button_unaffected_when_not_viewing_a_branch
          tests/test_store_management.py::test_viewing_store_card_does_not_change_employee_or_shift_data
          tests/test_ai_flow.py::test_ai_tahlil_button_removed_from_founder_menu
          tests/test_ai_flow.py::test_ai_tahlil_text_no_longer_triggers_open_ended_chat
          tests/test_calibration_bot_flows.py::test_calibration_question_filter_ignores_users_without_active_question
          tests/test_menu_and_fsm_escape.py::test_sotuvchi_menu_has_no_role_category_button
          tests/test_chat_cleanup.py::test_cleanup_deletes_all_tracked_messages_for_workflow
          tests/test_chat_cleanup.py::test_cleanup_survives_telegram_delete_failure
          tests/test_chat_cleanup.py::test_cleanup_only_touches_its_own_workflow_key
          tests/test_cash_shift_bot_flows.py::test_closeshift_clean_close_deletes_tracked_dialog_messages
          tests/test_recruiting_retention_scheduler.py::test_retention_purge_tick_deletes_only_expired_applications
          tests/test_recruiting_retention_scheduler.py::test_start_scheduler_registers_job_and_can_shutdown
          tests/test_menu_and_fsm_escape.py::test_nazoratchi_menu_buttons_are_friendly_and_paired_two_per_row
