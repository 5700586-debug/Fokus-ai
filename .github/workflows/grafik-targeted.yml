name: Grafik targeted tests

on:
  pull_request:
    paths:
      - 'services/permanent_schedule.py'
      - 'services/schedule_webapp.py'
      - 'services/work_time.py'
      - 'services/grading_webapp.py'
      - 'services/star_month.py'
      - 'services/payroll_view.py'
      - 'services/attendance.py'
      - 'repositories/attendance.py'
      - 'schema/attendance.py'
      - 'webapp_server.py'
      - 'assets/webapp/grafik.html'
      - 'tests/test_permanent_schedule.py'
      - 'tests/test_schedule_webapp.py'
      - '.github/workflows/grafik-targeted.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_permanent_schedule.py tests/test_schedule_webapp.py tests/test_work_time.py tests/test_payroll_view.py tests/test_star_month.py
