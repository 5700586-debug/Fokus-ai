name: E2E (real Telegram, fokus-ai-test)

# Qo'lda (Actions -> this workflow -> Run workflow) yoki
# feature/hr-conversational-interview push'ida ishga tushiriladi. Real Telethon
# akkaunt orqali deploy qilingan `fokus-ai-test` botiga real Telegram
# xabarlari yuboradi va javoblarni tekshiradi. main/production/real
# botga umuman tegmaydi — faqat E2E_TEST_BOT_USERNAME orqali
# ko'rsatilgan test botiga ulanadi.
#
# Kerakli GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   E2E_TELEGRAM_API_ID
#   E2E_TELEGRAM_API_HASH
#   E2E_TELEGRAM_SESSION
#   E2E_TEST_BOT_USERNAME
#
# Bular yo'q bo'lsa ish FAILED bo'ladi — qarang e2e/README.md.

on:
  push:
    branches:
      - feature/hr-conversational-interview
  workflow_dispatch: {}

# Bir vaqtning o'zida shu branch uchun faqat BITTA E2E run faol
# bo'lishi kerak -- ikkita parallel run bir xil Telethon test
# akkaunt/bot juftligi ustida bir xil chatda ishlasa, ular bir-
# birining xabarlarini "conversation" javobi deb noto'g'ri o'qib
# qo'yishi mumkin (Telethon client.conversation() global chat
# oqimini kuzatadi, run-specific emas). Yangi push kelsa eskisi
# bekor qilinadi -- eski kodni sinash keragi yo'q.
concurrency:
  group: e2e-real-telegram-${{ github.ref }}
  cancel-in-progress: true

# Muvaffaqiyatsizlik bo'lganda diagnostika matnini commit comment
# sifatida yozish uchun -- xom job log'ga tashqaridan (bu skriptni
# ishlatuvchi odam/agentdan) autentifikatsiyasiz kirish imkonsiz,
# lekin commit comment ODDIY (login talab qilmaydigan) API orqali
# o'qiladi. Boshqa hech qanday maqsadda write ishlatilmaydi.
permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E dependencies (Telethon only, main app deps not needed)
        run: pip install -r e2e/requirements.txt

      - name: Run real Telegram E2E scenario against fokus-ai-test
        id: e2e_run
        continue-on-error: true
        env:
          E2E_TELEGRAM_API_ID: ${{ secrets.E2E_TELEGRAM_API_ID }}
          E2E_TELEGRAM_API_HASH: ${{ secrets.E2E_TELEGRAM_API_HASH }}
          E2E_TELEGRAM_SESSION: ${{ secrets.E2E_TELEGRAM_SESSION }}
          E2E_TEST_BOT_USERNAME: ${{ secrets.E2E_TEST_BOT_USERNAME }}
        run: python -m e2e.run_e2e | tee e2e_output.log

      # Ikkinchi ssenariy -- RECRUITING tugma oqimi (qarang
      # e2e/run_recruiting_e2e.py). SHU job ichida, oldingi step
      # tugagach ketma-ket ishlaydi (bir xil Telethon akkaunt/bot
      # juftligi uchun parallel run bo'lmasin degan sabab yuqoridagi
      # concurrency izohi bilan bir xil).
      - name: Run real Telegram RECRUITING E2E scenario against fokus-ai-test
        id: e2e_recruiting_run
        continue-on-error: true
        env:
          E2E_TELEGRAM_API_ID: ${{ secrets.E2E_TELEGRAM_API_ID }}
          E2E_TELEGRAM_API_HASH: ${{ secrets.E2E_TELEGRAM_API_HASH }}
          E2E_TELEGRAM_SESSION: ${{ secrets.E2E_TELEGRAM_SESSION }}
          E2E_TEST_BOT_USERNAME: ${{ secrets.E2E_TEST_BOT_USERNAME }}
        run: python -m e2e.run_recruiting_e2e | tee e2e_recruiting_output.log

      # Uchinchi ssenariy -- NAZORATCHI tugma oqimi (qarang
      # e2e/run_nazoratchi_e2e.py). Xuddi shu job ichida, avvalgi ikki
      # step tugagach ketma-ket ishlaydi.
      - name: Run real Telegram NAZORATCHI E2E scenario against fokus-ai-test
        id: e2e_nazoratchi_run
        continue-on-error: true
        env:
          E2E_TELEGRAM_API_ID: ${{ secrets.E2E_TELEGRAM_API_ID }}
          E2E_TELEGRAM_API_HASH: ${{ secrets.E2E_TELEGRAM_API_HASH }}
          E2E_TELEGRAM_SESSION: ${{ secrets.E2E_TELEGRAM_SESSION }}
          E2E_TEST_BOT_USERNAME: ${{ secrets.E2E_TEST_BOT_USERNAME }}
        run: python -m e2e.run_nazoratchi_e2e | tee e2e_nazoratchi_output.log

      # To'rtinchi ssenariy -- KASSIR KUNLIK HISOBOT (Daily Report V1)
      # oqimi (qarang e2e/run_cashshift_e2e.py). Xuddi shu job ichida,
      # avvalgi uch step tugagach ketma-ket ishlaydi.
      - name: Run real Telegram CASH SHIFT DAILY REPORT E2E scenario against fokus-ai-test
        id: e2e_cashshift_run
        continue-on-error: true
        env:
          E2E_TELEGRAM_API_ID: ${{ secrets.E2E_TELEGRAM_API_ID }}
          E2E_TELEGRAM_API_HASH: ${{ secrets.E2E_TELEGRAM_API_HASH }}
          E2E_TELEGRAM_SESSION: ${{ secrets.E2E_TELEGRAM_SESSION }}
          E2E_TEST_BOT_USERNAME: ${{ secrets.E2E_TEST_BOT_USERNAME }}
        run: python -m e2e.run_cashshift_e2e | tee e2e_cashshift_output.log

      # Xom job log'ga tashqi tomondan autentifikatsiyasiz kirish
      # imkonsizligi tasdiqlangani uchun (GitHub REST/HTML orqali
      # bir necha usul sinaldi) -- muvaffaqiyatsizlikda skript(lar)
      # chiqargan diagnostika (session/token/secret HECH QACHON
      # o'z ichiga olmaydi, qarang e2e/run_e2e.py,
      # e2e/run_recruiting_e2e.py va e2e/run_nazoratchi_e2e.py) shu
      # commit'ning o'ziga izoh sifatida yoziladi, keyin oddiy (auth
      # talab qilmaydigan) API orqali o'qiladi. Ssenariylardan qay
      # biri muvaffaqiyatsiz bo'lsa ham shu step ishga tushadi, faqat
      # tegishli log(lar)ni qo'shadi.
      - name: Post E2E diagnostics as a commit comment on failure
        if: steps.e2e_run.outcome == 'failure' || steps.e2e_recruiting_run.outcome == 'failure' || steps.e2e_nazoratchi_run.outcome == 'failure' || steps.e2e_cashshift_run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SANDBOX_FAILED: ${{ steps.e2e_run.outcome == 'failure' }}
          RECRUITING_FAILED: ${{ steps.e2e_recruiting_run.outcome == 'failure' }}
          NAZORATCHI_FAILED: ${{ steps.e2e_nazoratchi_run.outcome == 'failure' }}
          CASHSHIFT_FAILED: ${{ steps.e2e_cashshift_run.outcome == 'failure' }}
        run: |
          python - <<'PY'
          import json
          import os

          sections = []

          if os.environ.get("SANDBOX_FAILED") == "true":
              with open("e2e_output.log", "r", errors="replace") as f:
                  log = f.read()
              sections.append("### Sandbox E2E (run_e2e.py)\n\n```\n" + log[-25000:] + "\n```")

          if os.environ.get("RECRUITING_FAILED") == "true":
              with open("e2e_recruiting_output.log", "r", errors="replace") as f:
                  log = f.read()
              sections.append("### Recruiting E2E (run_recruiting_e2e.py)\n\n```\n" + log[-25000:] + "\n```")

          if os.environ.get("NAZORATCHI_FAILED") == "true":
              with open("e2e_nazoratchi_output.log", "r", errors="replace") as f:
                  log = f.read()
              sections.append("### Nazoratchi E2E (run_nazoratchi_e2e.py)\n\n```\n" + log[-25000:] + "\n```")

          if os.environ.get("CASHSHIFT_FAILED") == "true":
              with open("e2e_cashshift_output.log", "r", errors="replace") as f:
                  log = f.read()
              sections.append("### Cash Shift Daily Report E2E (run_cashshift_e2e.py)\n\n```\n" + log[-25000:] + "\n```")

          body = "## E2E diagnostics (auto-posted on failure)\n\n" + "\n\n".join(sections)

          with open("comment_body.json", "w") as f:
              json.dump({"body": body}, f)
          PY

          curl -sS -o curl_response.json -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @comment_body.json

      - name: Fail the job if any E2E scenario failed
        if: steps.e2e_run.outcome == 'failure' || steps.e2e_recruiting_run.outcome == 'failure' || steps.e2e_nazoratchi_run.outcome == 'failure' || steps.e2e_cashshift_run.outcome == 'failure'
        run: exit 1
