          tests/test_nazoratchi_supervision.py::test_penalty_other_no_ai_match_falls_back_to_founder_directly
          | tee smoke_output.log

      - name: Post smoke diagnostics as a commit comment on failure
        if: steps.smoke_run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json

          with open("smoke_output.log", "r", errors="replace") as f:
              log = f.read()

          body = "## Smoke test diagnostics (auto-posted on failure)\n\n```\n" + log[-55000:] + "\n```"

          with open("comment_body.json", "w") as f:
              json.dump({"body": body}, f)
          PY

          curl -sS -o curl_response.json -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @comment_body.json

      - name: Fail the job if smoke tests failed
        if: steps.smoke_run.outcome == 'failure'
        run: exit 1
