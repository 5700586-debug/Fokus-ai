name: E2E (real Telegram, fokus-ai-test)

# Qo'lda (Actions -> this workflow -> Run workflow) yoki
# feature/hr-conversational-interview push'ida ishga tushiriladi. Real Telethon
# akkaunt orqali deploy qilingan `fokus-ai-test` botiga real Telegram
# xabarlari yuboradi va javoblarni tekshiradi. main/production/real
# botga umuman tegmaydi — faqat E2E_TEST_BOT_USERNAME orqali
# ko'rsatilgan test botiga ulanadi.
#
# Kerakli GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   E2E_TELEGRAM_API_ID
#   E2E_TELEGRAM_API_HASH
#   E2E_TELEGRAM_SESSION
#   E2E_TEST_BOT_USERNAME
#
# Bular yo'q bo'lsa ish FAILED bo'ladi — qarang e2e/README.md.

on:
  push:
    branches:
      - feature/hr-conversational-interview
  workflow_dispatch: {}

# Bir vaqtning o'zida shu branch uchun faqat BITTA E2E run faol
# bo'lishi kerak -- ikkita parallel run bir xil Telethon test
# akkaunt/bot juftligi ustida bir xil chatda ishlasa, ular bir-
# birining xabarlarini "conversation" javobi deb noto'g'ri o'qib
# qo'yishi mumkin (Telethon client.conversation() global chat
# oqimini kuzatadi, run-specific emas). Yangi push kelsa eskisi
# bekor qilinadi -- eski kodni sinash keragi yo'q.
concurrency:
  group: e2e-real-telegram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E dependencies (Telethon only, main app deps not needed)
        run: pip install -r e2e/requirements.txt

      - name: Run real Telegram E2E scenario against fokus-ai-test
        env:
          E2E_TELEGRAM_API_ID: ${{ secrets.E2E_TELEGRAM_API_ID }}
          E2E_TELEGRAM_API_HASH: ${{ secrets.E2E_TELEGRAM_API_HASH }}
          E2E_TELEGRAM_SESSION: ${{ secrets.E2E_TELEGRAM_SESSION }}
          E2E_TEST_BOT_USERNAME: ${{ secrets.E2E_TEST_BOT_USERNAME }}
        run: python -m e2e.run_e2e
