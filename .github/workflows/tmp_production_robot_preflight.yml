name: TMP production robot preflight

# Stage 1 ONLY: existing Telethon robot session'ning ishlashini va
# haqiqiy PRODUCTION botiga (@Xoqandiy_ai_bot) ulana olishini
# tekshiradi. Test botiga (fokus-ai-test) umuman tegmaydi, DB/kodga
# hech narsa yozmaydi. Vaqtinchalik -- ish tugagach o'chiriladi.

on:
  push:
    branches: [chore/production-robot-preflight]

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/production-robot-preflight

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r e2e/requirements.txt

      - id: preflight_run
        continue-on-error: true
        env:
          E2E_TELEGRAM_API_ID: ${{ secrets.E2E_TELEGRAM_API_ID }}
          E2E_TELEGRAM_API_HASH: ${{ secrets.E2E_TELEGRAM_API_HASH }}
          E2E_TELEGRAM_SESSION: ${{ secrets.E2E_TELEGRAM_SESSION }}
        run: |
          set -o pipefail
          python -m e2e.run_production_robot_preflight | tee preflight_output.log

      # Faqat xavfsiz, oldindan belgilangan xulosa qatorlari
      # saqlanadi (robot ID, username mosligi, PASS/FAIL, javob
      # vaqti) -- xom log HECH QACHON commit qilinmaydi, garchi
      # skriptning o'zi ham hech qanday maxfiy qiymat chop etmasa ham.
      - if: always()
        run: |
          grep -E '^(ROBOT_TELEGRAM_ID|BOT_USERNAME_MATCH|PRODUCTION_BOT_RESPONSE|RESPONSE_TIME_SECONDS)=|ONE-TIME TELEGRAM SESSION LOGIN REQUIRED' preflight_output.log > PREFLIGHT_OUTPUT.txt || true
          cat PREFLIGHT_OUTPUT.txt

      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PREFLIGHT_OUTPUT.txt
          git commit -m "chore: record production robot preflight summary" || echo "nothing to commit"
          git push origin HEAD:chore/production-robot-preflight

      - if: steps.preflight_run.outcome == 'failure'
        run: exit 1
