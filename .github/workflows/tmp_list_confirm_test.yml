name: TMP list confirm post-save test

on:
  push:
    branches: [fix/list-confirm-post-save]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: fokus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:testpass@localhost:5432/fokus_test"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/list-confirm-post-save

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - name: Focused regression test
        id: test_run
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -v -s \
            tests/test_e2e_test_isolation.py::test_confirm_with_inaccessible_callback_message_does_not_crash \
            | tee test_output.log

      - if: steps.test_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failure-output
          path: test_output.log

      - if: steps.test_run.outcome == 'failure'
        run: exit 1
