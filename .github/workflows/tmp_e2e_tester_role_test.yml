name: TMP e2e tester role test

on:
  push:
    branches: [feature/e2e-tester-role]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: fokus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:testpass@localhost:5432/fokus_test"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/e2e-tester-role

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - id: test_run
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -v tests/test_e2e_tester_role.py tests/test_e2e_test_isolation.py tests/test_shift_deficiency_bot_flow.py tests/test_supplier_purchase_listing.py tests/test_db_migration.py | tee test_output.log

      - if: steps.test_run.outcome == 'failure'
        run: cp test_output.log CI_FAILURE_OUTPUT.txt

      - if: steps.test_run.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CI_FAILURE_OUTPUT.txt
          git commit -m "chore: record e2e tester role test failure output"
          git push origin HEAD:feature/e2e-tester-role

      - if: steps.test_run.outcome == 'failure'
        run: exit 1
