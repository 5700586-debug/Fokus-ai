name: tmp-latency-probe-test

on:
  push:
    branches:
      - chore/shared-latency-timing-probe

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fokus
          POSTGRES_PASSWORD: fokus
          POSTGRES_DB: fokus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fokus:fokus@localhost:5432/fokus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run focused latency-probe and touched-flow tests
        run: |
          set +e
          python -m pytest -v \
            tests/test_latency_probe.py \
            tests/test_e2e_test_isolation.py \
            tests/test_shift_deficiency_bot_flow.py \
            tests/test_e2e_tester_role.py \
            > pytest_output.txt 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            tail -c 900 pytest_output.txt | tr '\n' '~' > /tmp/tail.txt
            echo "::error::$(cat /tmp/tail.txt)"
          fi
          exit $status
      - name: Upload failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_output.txt
          if-no-files-found: ignore
