name: Temp onboarding resume targeted test

# VAQTINCHALIK workflow — faqat fix/onboarding-resume-prompt branchini
# tekshirish uchun, PASS bo'lgach o'chiriladi. Boshqa hech qanday
# doimiy workflow o'zgartirilmagan.

on:
  push:
    branches:
      - fix/onboarding-resume-prompt

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run targeted onboarding resume test
        id: test_run
        continue-on-error: true
        run: >
          set -o pipefail;
          pytest -v
          tests/test_bot_flows.py::test_reopening_invite_does_not_erase_active_onboarding
          | tee test_output.log

      - name: Commit raw output on failure
        if: steps.test_run.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp test_output.log CI_FAILURE_OUTPUT.txt
          git add CI_FAILURE_OUTPUT.txt
          git commit -m "chore: record onboarding resume test failure output"
          git push

      - name: Fail the job if the test failed
        if: steps.test_run.outcome == 'failure'
        run: exit 1
