name: TMP production robot E2E

on:
  push:
    branches: [test/production-robot-e2e]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/production-robot-e2e

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r e2e/requirements.txt

      - name: Run production robot E2E scenario
        env:
          E2E_TELEGRAM_API_ID: ${{ secrets.E2E_TELEGRAM_API_ID }}
          E2E_TELEGRAM_API_HASH: ${{ secrets.E2E_TELEGRAM_API_HASH }}
          E2E_TELEGRAM_SESSION: ${{ secrets.E2E_TELEGRAM_SESSION }}
        run: python -m e2e.run_production_robot_scenario
