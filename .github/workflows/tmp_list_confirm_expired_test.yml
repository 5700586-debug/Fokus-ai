name: tmp-list-confirm-expired-test

on:
  push:
    branches:
      - fix/list-confirm-expired-query

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fokus
          POSTGRES_PASSWORD: fokus
          POSTGRES_DB: fokus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fokus:fokus@localhost:5432/fokus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run focused expired-callback regression test
        run: |
          set +e
          python -m pytest -v \
            tests/test_e2e_test_isolation.py::test_confirm_survives_expired_callback_after_slow_db_save \
            tests/test_shift_deficiency_bot_flow.py::test_multiline_list_confirm_db_failure_preserves_list_for_retry \
            > pytest_output.txt 2>&1
          status=$?
          {
            echo '## pytest output'
            echo '```'
            cat pytest_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            tail -c 900 pytest_output.txt | tr '\n' '~' > /tmp/tail.txt
            echo "::error::$(cat /tmp/tail.txt)"
          fi
          exit $status
      - name: Upload failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest_output.txt
          if-no-files-found: ignore
