name: Temp onboarding resume targeted test

# VAQTINCHALIK workflow — faqat fix/onboarding-resume-prompt branchini
# tekshirish uchun, PASS bo'lgach o'chiriladi. Boshqa hech qanday
# doimiy workflow o'zgartirilmagan.

on:
  push:
    branches:
      - fix/onboarding-resume-prompt

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run targeted onboarding resume test
        id: test_run
        continue-on-error: true
        run: >
          set -o pipefail;
          pytest -v
          tests/test_bot_flows.py::test_reopening_invite_does_not_erase_active_onboarding
          | tee test_output.log

      - name: Post diagnostics as a commit comment on failure
        if: steps.test_run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json

          with open("test_output.log", "r", errors="replace") as f:
              log = f.read()

          body = "## Onboarding resume test diagnostics (auto-posted on failure)\n\n```\n" + log[-55000:] + "\n```"

          with open("comment_body.json", "w") as f:
              json.dump({"body": body}, f)
          PY

          curl -sS -o curl_response.json -w "HTTP %{http_code}\n" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/commits/$SHA/comments" \
            -d @comment_body.json

      - name: Fail the job if the test failed
        if: steps.test_run.outcome == 'failure'
        run: exit 1
