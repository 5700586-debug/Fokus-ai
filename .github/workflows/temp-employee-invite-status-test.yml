name: Temp employee invite status test

on:
  push:
    branches: [fix/employee-invite-status]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/employee-invite-status
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - id: test_run
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -v tests/test_invites.py tests/test_bot_flows.py -k "expired_pending or active_pending or claimed_pending" | tee test_output.log
      - if: steps.test_run.outcome == 'failure'
        run: cp test_output.log CI_FAILURE_OUTPUT.txt
      - if: steps.test_run.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CI_FAILURE_OUTPUT.txt
          git commit -m "chore: record employee invite status test failure output"
          git push origin HEAD:fix/employee-invite-status
      - if: steps.test_run.outcome == 'failure'
        run: exit 1
