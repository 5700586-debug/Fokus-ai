name: Founder report latency targeted tests

on:
  pull_request:
    paths:
      - 'services/period_report.py'
      - 'tests/test_period_report.py'
      - '.github/workflows/founder-report-targeted.yml'

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      TEST_BOT_TOKEN: '123456:TEST-TOKEN'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_period_report.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: fokus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      TEST_DATABASE_URL: 'postgresql://postgres:testpass@localhost:5432/fokus_test'
      DATABASE_URL: 'postgresql://postgres:testpass@localhost:5432/fokus_test'
      TEST_BOT_TOKEN: '123456:TEST-TOKEN'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Verify disposable local test DB only
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          u = os.environ["TEST_DATABASE_URL"]
          p = urlparse(u)
          assert u == os.environ["DATABASE_URL"]
          assert p.hostname == "localhost" and p.path == "/fokus_test"
          assert os.environ["ENVIRONMENT"] == "test"
          PY
      - run: python -m pytest -q tests/test_period_report.py
