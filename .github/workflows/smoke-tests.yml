name: Smoke tests

# Har pushda ishlaydi — TEZ va KICHIK: haqiqiy dependency (shu jumladan
# haqiqiy psycopg2, hech qanday stub yo'q) o'rnatiladi va faqat eng
# muhim, barqaror ishlaydigan bir nechta test ishga tushiriladi. To'liq
# (900+) to'plam uchun qarang ``tests.yml`` (endi faqat qo'lda
# ishga tushiriladi).

on:
  push:
    branches:
      - feature/hr-conversational-interview
  workflow_dispatch: {}

# E2E workflow'dagi bilan bir xil sabab: xom job log'ga
# autentifikatsiyasiz kirish imkonsiz -- muvaffaqiyatsizlikda pytest
# chiqishi shu commit'ga comment sifatida yoziladi (workflow'ning
# bepul GITHUB_TOKEN'i orqali, yangi credential shart emas), keyin
# oddiy public API orqali o'qiladi.
permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify real psycopg2 import (no stub/workaround)
        run: python -c "import psycopg2; print('psycopg2 import OK:', psycopg2.__version__)"

      - name: Smoke tests
        id: smoke_run
        continue-on-error: true
        run: >
          pytest -v
          tests/test_saturn_group_bot_flows.py::test_saturntest_tip_sends_only_tip_no_financial_dashboard
          tests/test_saturn_group_bot_flows.py::test_daily_greeting_messages_have_no_financial_block
          tests/test_recruiting_card.py::test_card_shows_birth_date
          tests/test_recruiting_card.py::test_card_computes_age_correctly_from_birth_date
          tests/test_cash_shift_bot_flows.py::test_discrepancy_approve_finalizes_handed_over_shift
          tests/test_cash_shift_bot_flows.py::test_discrepancy_recount_keeps_shift_open_and_resets_kassir_state
          tests/test_bot_flows.py::test_approve_sends_employee_menu_without_requiring_start
          tests/test_bot_flows.py::test_build_menu_and_category_menu_are_persistent
          tests/test_menu_and_fsm_escape.py::test_kassir_menu_buttons_are_paired_two_per_row
          tests/test_menu_and_fsm_escape.py::test_kassir_friendly_button_still_triggers_real_command
          tests/test_menu_and_fsm_escape.py::test_kassir_friendly_button_escapes_stale_expense_state
          tests/test_menu_and_fsm_escape.py::test_start_shows_role_specific_category_for_kassir
          tests/test_cash_shifts_repo.py::test_set_shift_status_if_only_updates_when_status_matches
          tests/test_cash_shift_service.py::test_duplicate_supervisor_decision_only_applies_once
          tests/test_cash_shift_service.py::test_duplicate_confirm_handover_only_succeeds_once
          tests/test_employees.py::test_duplicate_approve_only_succeeds_once
          tests/test_recruiting_permissions.py::test_founder_hire_creates_active_employee_with_role_branch_and_auto_menu
          tests/test_recruiting_permissions.py::test_double_hire_click_does_not_crash_or_duplicate
          tests/test_recruiting_permissions.py::test_set_founder_decision_if_only_claims_when_status_matches
