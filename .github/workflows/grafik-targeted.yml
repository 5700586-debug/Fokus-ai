name: Grafik targeted tests

on:
  pull_request:
    paths:
      - 'services/permanent_schedule.py'
      - 'services/schedule_webapp.py'
      - 'services/work_time.py'
      - 'services/grading_webapp.py'
      - 'services/star_month.py'
      - 'services/payroll_view.py'
      - 'services/attendance.py'
      - 'repositories/attendance.py'
      - 'schema/attendance.py'
      - 'webapp_server.py'
      - 'assets/webapp/grafik.html'
      - 'tests/test_permanent_schedule.py'
      - 'tests/test_schedule_webapp.py'
      - 'tests/test_period_report.py'
      - 'services/period_report.py'
      - '.github/workflows/grafik-targeted.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      # Synthetic token; tests use RecordingBot and never contact Telegram.
      TEST_BOT_TOKEN: '123456:TEST-TOKEN'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_permanent_schedule.py tests/test_schedule_webapp.py tests/test_work_time.py tests/test_payroll_view.py tests/test_star_month.py tests/test_period_report.py

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: fokus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      # Both are the same LOCAL disposable DB: db.py reads TEST_DATABASE_URL;
      # legacy pytest fixture recognizes DATABASE_URL.
      TEST_DATABASE_URL: 'postgresql://postgres:testpass@localhost:5432/fokus_test'
      DATABASE_URL: 'postgresql://postgres:testpass@localhost:5432/fokus_test'
      TEST_BOT_TOKEN: '123456:TEST-TOKEN'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Enforce isolated PostgreSQL test DB
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          test_url = os.environ["TEST_DATABASE_URL"]
          assert test_url == os.environ["DATABASE_URL"], "Different DB URLs"
          parsed = urlparse(test_url)
          assert parsed.hostname == "localhost" and parsed.path == "/fokus_test", "Non-test database blocked"
          assert os.environ["ENVIRONMENT"] == "test"
          PY
      - run: python -m pytest -q tests/test_permanent_schedule.py tests/test_schedule_webapp.py tests/test_work_time.py tests/test_payroll_view.py tests/test_star_month.py tests/test_period_report.py
